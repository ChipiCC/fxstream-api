# Tool versions & tasks for this project.
# Run `mise install` once, then `mise tasks` to see everything.

[tools]
python = "3.15"
uv = "latest"

[env]
# Use a project-local virtualenv managed by uv.
_.python.venv = { path = ".venv", create = true }

[tasks.sync]
description = "Install/refresh dependencies from the lockfile"
run = "uv sync --all-groups"

[tasks.dev]
description = "Run the API with autoreload"
run = "uv run uvicorn app:app --reload --host 0.0.0.0 --port 8000"

[tasks.serve]
description = "Run the API without autoreload"
run = "uv run uvicorn app:app --host 0.0.0.0 --port 8000"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.format]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.fix]
description = "Autofix lint issues"
run = "uv run ruff check --fix . && uv run ruff format ."

[tasks.typecheck]
description = "Static type checking with mypy"
run = "uv run mypy src tests"

[tasks.test]
description = "Run the test suite (requires Postgres: mise run db:up)"
run = "uv run pytest"

[tasks.check]
description = "Run lint + typecheck + tests"
depends = ["lint", "typecheck", "test"]

[tasks.migrate]
description = "Apply database migrations"
run = "uv run alembic upgrade head"

[tasks.revision]
description = "Create a new empty migration (usage: mise revision 'msg')"
run = "uv run alembic revision -m"

# --- Local Postgres (via Docker Compose) ------------------------------------

[tasks."db:up"]
description = "Start Postgres via Docker Compose"
run = "docker compose up -d db"

[tasks."db:down"]
description = "Stop Postgres"
run = "docker compose stop db"

[tasks."db:reset"]
description = "Recreate the Postgres volume"
run = "docker compose down -v db && docker compose up -d db"

# --- Docker Compose ---------------------------------------------------------

[tasks."docker:up"]
description = "Start app + postgres via compose"
run = "docker compose up --build"

[tasks."docker:down"]
description = "Stop compose stack"
run = "docker compose down -v"
