name: Dependabot auto-merge

# pull_request_target (not pull_request) is required because Dependabot-triggered
# runs on `pull_request` get a read-only GITHUB_TOKEN and cannot enable auto-merge.
# SECURITY: this workflow runs in the base-repo context with a write token, so it
# must never check out or execute code from the pull request. It only reads PR
# metadata and calls `gh`. See docs/dependencies.md.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # update-type is the highest semver bump in the PR. Requiring it to be
      # "patch" auto-merges single patch updates and all-patch groups, while
      # leaving any minor/major bump for human review.
      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
